name: mobile-share-proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-share-proof.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-share-proof.yml'

jobs:
  android-share-proof:
    name: Android share intent proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run web:export
      - run: npm run android:prebuild
      - name: Verify Android share intent filters
        run: node scripts/verify-android-share-intent.mjs
      - name: Build Android debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        working-directory: apps/mobile/android
      - name: Run Android emulator share smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: apps/mobile
          script: bash scripts/run-android-share-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-share-proof
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/mobile/android-activity-dump.txt
            artifacts/mobile/android-resolved-share-activity.txt
            artifacts/mobile/android-share-start.txt
            artifacts/mobile/android-share-logcat.txt
            artifacts/mobile/android-metro.log
            artifacts/mobile/android-secure-store-files.txt
            artifacts/mobile/android-share-receipt.png
            artifacts/mobile/android-share-intent-manifest-check.json
            artifacts/mobile/android-failure-activity-dump.txt
            artifacts/mobile/android-failure-logcat.txt
            artifacts/mobile/android-failure-secure-store-files.txt
            artifacts/mobile/android-failure-screenshot.png
            apps/mobile/dist-web

  ios-simulator-proof:
    name: iOS simulator build proof
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run ios:prebuild
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios
      - name: Build iOS app for simulator
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mobile
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          if [ ${#workspaces[@]} -eq 0 ]; then
            echo "No .xcworkspace found under apps/mobile/ios" >&2
            exit 1
          fi
          WORKSPACE="${workspaces[0]}"
          SCHEME="${WORKSPACE##*/}"
          SCHEME="${SCHEME%.xcworkspace}"
          export SCHEME
          xcodebuild -list -json -workspace "$WORKSPACE" | ruby -rjson -e 'schemes = JSON.parse(STDIN.read).dig("workspace", "schemes") || []; target = ENV.fetch("SCHEME"); abort("Missing expected app scheme: #{target}") unless schemes.include?(target)'
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ios/build \
            build > ../../artifacts/mobile/ios-simulator-build.log 2>&1
      - name: Run iOS simulator share handoff smoke
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mobile
          SMOKE_LOG=../../artifacts/mobile/ios-share-smoke.log
          : > "$SMOKE_LOG"
          exec > >(tee -a "$SMOKE_LOG") 2>&1
          set -x
          METRO_PID=''
          PREFS_ERROR_TMP=''
          cleanup() {
            local status=$?
            local metro_status=0
            trap - EXIT
            if [[ -n "$METRO_PID" ]]; then
              if kill -0 "$METRO_PID" 2>/dev/null; then
                kill "$METRO_PID" 2>/dev/null || true
                wait "$METRO_PID" 2>/dev/null || true
              else
                if wait "$METRO_PID" 2>/dev/null; then
                  metro_status=0
                else
                  metro_status=$?
                fi
                if [[ "$status" -eq 0 ]]; then
                  if [[ "$metro_status" -eq 0 ]]; then status=1; else status="$metro_status"; fi
                fi
              fi
            fi
            if [[ "$status" -ne 0 && -n "$PREFS_ERROR_TMP" && -s "$PREFS_ERROR_TMP" ]]; then
              cp "$PREFS_ERROR_TMP" ../../artifacts/mobile/ios-share-preferences-failure.log || true
            fi
            if [[ -n "$PREFS_ERROR_TMP" ]]; then rm -f "$PREFS_ERROR_TMP" || true; fi
            exit "$status"
          }
          trap cleanup EXIT
          CI=1 npx expo start --dev-client --port 8081 > ../../artifacts/mobile/ios-metro.log 2>&1 &
          METRO_PID=$!
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/status && break
            kill -0 "$METRO_PID"
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/status
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read).fetch("devices").values.flatten; device = devices.find { |candidate| candidate["name"] == "iPhone 15" && candidate["isAvailable"] }; abort("No available iPhone 15 simulator found") unless device; puts device.fetch("udid")')"
          if ! BOOT_OUTPUT="$(xcrun simctl boot "$SIMULATOR_UDID" 2>&1)"; then
            printf '%s\n' "$BOOT_OUTPUT"
            xcrun simctl list devices | grep -F "$SIMULATOR_UDID" | grep -q '(Booted)'
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          APP_PATH="$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' ! -name '*ShareExtension*' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" com.picturejournal.mobile
          GROUP_CONTAINER=''
          for attempt in $(seq 1 30); do
            if GROUP_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.picturejournal.mobile group.com.picturejournal.mobile 2>> "$SMOKE_LOG")"; then
              break
            fi
            sleep 2
          done
          test -n "$GROUP_CONTAINER"
          bundle_ready=0
          for attempt in $(seq 1 60); do
            if python3 - ../../artifacts/mobile/ios-metro.log <<'PY'
          import pathlib
          import sys

          log = pathlib.Path(sys.argv[1])
          raise SystemExit(0 if log.exists() and "iOS Bundled" in log.read_text(errors="replace") else 1)
          PY
            then
              bundle_ready=1
              break
            fi
            kill -0 "$METRO_PID"
            sleep 2
          done
          test "$bundle_ready" -eq 1
          xcrun simctl terminate "$SIMULATOR_UDID" com.picturejournal.mobile
          PREFS_PATH="$GROUP_CONTAINER/Library/Preferences/group.com.picturejournal.mobile"
          PREFS_PLIST="$PREFS_PATH.plist"
          RUN_NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          SENTINEL_VALUE="ci-domain-readable-${RUN_NONCE}"
          SHARE_PAYLOAD="Cafe Onion GitHub Actions iOS nonce-${RUN_NONCE}"
          defaults write "$PREFS_PATH" picturejournalReceiptSentinel -string "$SENTINEL_VALUE"
          defaults write "$PREFS_PATH" picturejournalShareKey -array "$SHARE_PAYLOAD"
          test -f "$PREFS_PLIST"
          test "$(plutil -extract picturejournalReceiptSentinel raw -o - "$PREFS_PLIST")" = "$SENTINEL_VALUE"
          test "$(plutil -extract picturejournalShareKey.0 raw -o - "$PREFS_PLIST")" = "$SHARE_PAYLOAD"
          defaults read "$PREFS_PATH" > ../../artifacts/mobile/ios-share-preferences-before.txt
          xcrun simctl spawn "$SIMULATOR_UDID" killall cfprefsd || true
          xcrun simctl launch "$SIMULATOR_UDID" com.picturejournal.mobile
          sleep 10
          xcrun simctl openurl "$SIMULATOR_UDID" 'picturejournal://dataUrl=picturejournalShareKey#text'
          PREFS_ERROR_TMP="$(mktemp /tmp/picturejournal-prefs.XXXXXX)"
          : > "$PREFS_ERROR_TMP"
          share_received=0
          for attempt in $(seq 1 60); do
            if python3 - "$PREFS_PLIST" "$SENTINEL_VALUE" 2>> "$PREFS_ERROR_TMP" <<'PY'
          import plistlib
          import sys

          path, sentinel = sys.argv[1:3]
          with open(path, "rb") as preferences_file:
              preferences = plistlib.load(preferences_file)
          if preferences.get("picturejournalReceiptSentinel") != sentinel:
              raise SystemExit(10)
          if "picturejournalShareKey" in preferences:
              raise SystemExit(11)
          PY
            then
              plutil -p "$PREFS_PLIST" > ../../artifacts/mobile/ios-share-preferences-after.txt
              share_received=1
              break
            else
              preference_status=$?
              if [[ "$preference_status" -ne 10 && "$preference_status" -ne 11 ]]; then
                printf 'fatal plist verification failure (status=%s)\n' "$preference_status" >> "$PREFS_ERROR_TMP"
                exit "$preference_status"
              fi
              printf 'attempt=%s plist state not ready (status=%s)\n' "$attempt" "$preference_status" >> "$PREFS_ERROR_TMP"
            fi
            kill -0 "$METRO_PID"
            sleep 2
          done
          test "$share_received" -eq 1
          kill -0 "$METRO_PID"
          curl -fsS http://127.0.0.1:8081/status
          test -s ../../artifacts/mobile/ios-share-preferences-after.txt
          HANDOFF_RECEIPT="picturejournalShareKey consumed after durable app receipt [${RUN_NONCE}]"
          printf '%s\n' "$HANDOFF_RECEIPT" > ../../artifacts/mobile/ios-share-handoff.txt
          test "$(< ../../artifacts/mobile/ios-share-handoff.txt)" = "$HANDOFF_RECEIPT"
          xcrun simctl io "$SIMULATOR_UDID" screenshot ../../artifacts/mobile/ios-share-receipt.png
          node scripts/verify-png.mjs ../../artifacts/mobile/ios-share-receipt.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-proof
          path: |
            artifacts/mobile/ios-simulator-build.log
            artifacts/mobile/ios-metro.log
            artifacts/mobile/ios-share-receipt.png
            artifacts/mobile/ios-share-handoff.txt
            artifacts/mobile/ios-share-preferences-before.txt
            artifacts/mobile/ios-share-preferences-after.txt
            artifacts/mobile/ios-share-preferences-failure.log
            artifacts/mobile/ios-share-smoke.log
