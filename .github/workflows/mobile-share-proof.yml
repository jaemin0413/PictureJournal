name: mobile-share-proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-share-proof.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-share-proof.yml'

jobs:
  android-share-proof:
    name: Android share intent proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run web:export
      - run: npm run android:prebuild
      - name: Verify Android share intent filters
        run: node scripts/verify-android-share-intent.mjs
      - name: Build Android debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        working-directory: apps/mobile/android
      - name: Run Android emulator share smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: apps/mobile
          script: bash scripts/run-android-share-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-share-proof
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/mobile/android-activity-dump.txt
            artifacts/mobile/android-resolved-share-activity.txt
            artifacts/mobile/android-share-start.txt
            artifacts/mobile/android-share-logcat.txt
            artifacts/mobile/android-metro.log
            artifacts/mobile/android-secure-store-files.txt
            artifacts/mobile/android-share-receipt.png
            artifacts/mobile/android-share-intent-manifest-check.json
            artifacts/mobile/android-failure-activity-dump.txt
            artifacts/mobile/android-failure-logcat.txt
            artifacts/mobile/android-failure-secure-store-files.txt
            artifacts/mobile/android-failure-screenshot.png
            apps/mobile/dist-web

  ios-simulator-proof:
    name: iOS Share Sheet E2E proof
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run ios:prebuild
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios
      - name: Build Picture Journal for simulator
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mobile
          WORKSPACE="$(echo ios/*.xcworkspace)"
          SCHEME="${WORKSPACE##*/}"
          SCHEME="${SCHEME%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -derivedDataPath ios/build build | tee ../../artifacts/mobile/ios-simulator-build.log
      - name: Boot simulator and install Picture Journal
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read).fetch("devices").values.flatten; device = devices.find { |candidate| candidate["name"] == "iPhone 15" && candidate["isAvailable"] }; abort("No available iPhone 15 simulator found") unless device; puts device.fetch("udid")')"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          APP_PATH="$(echo ios/build/Build/Products/Debug-iphonesimulator/*.app)"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          printf '%s\n' "$SIMULATOR_UDID" > ../../artifacts/mobile/ios-simulator-udid.txt
      - name: Start Metro and run fixture Share Sheet UI test
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mobile
          SIMULATOR_UDID="$(< ../../artifacts/mobile/ios-simulator-udid.txt)"
          CI=1 npx expo start --dev-client --port 8081 > ../../artifacts/mobile/ios-metro.log 2>&1 &
          METRO_PID=$!
          trap 'kill "$METRO_PID" || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/status && break; sleep 2; done
          curl -fsS http://127.0.0.1:8081/status
          xcrun simctl launch "$SIMULATOR_UDID" com.picturejournal.mobile
          for attempt in $(seq 1 60); do
            if ruby -e 'exit(File.exist?(ARGV[0]) && File.read(ARGV[0]).include?("iOS Bundled") ? 0 : 1)' ../../artifacts/mobile/ios-metro.log; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Metro did not bundle the iOS dev client within 120 seconds."
              exit 1
            fi
            sleep 2
          done
          xcrun simctl terminate "$SIMULATOR_UDID" com.picturejournal.mobile
          xcodebuild -project ios-share-fixture/ShareFixture.xcodeproj -scheme ShareFixture -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath ios-share-fixture/build -resultBundlePath ../../artifacts/mobile/ios-share-fixture.xcresult test | tee ../../artifacts/mobile/ios-share-fixture-test.log
          if xcrun simctl spawn "$SIMULATOR_UDID" defaults read group.com.picturejournal.mobile > ../../artifacts/mobile/ios-app-group-preferences.txt; then
            :
          else
            printf '%s\n' 'No app-group preferences domain exists.' >> ../../artifacts/mobile/ios-app-group-preferences.txt
          fi
          if ruby -e 'exit(File.read(ARGV.fetch(0)).include?("picturejournalShareKey") ? 0 : 1)' ../../artifacts/mobile/ios-app-group-preferences.txt; then
            echo 'Stale picturejournalShareKey remains in the Picture Journal app-group preferences domain.'
            exit 1
          fi
          xcrun xcresulttool get --path ../../artifacts/mobile/ios-share-fixture.xcresult --format json > ../../artifacts/mobile/ios-share-fixture-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-proof
          path: |
            artifacts/mobile/ios-simulator-build.log
            artifacts/mobile/ios-metro.log
            artifacts/mobile/ios-share-fixture-test.log
            artifacts/mobile/ios-share-fixture-summary.json
            artifacts/mobile/ios-app-group-preferences.txt
            artifacts/mobile/ios-share-fixture.xcresult