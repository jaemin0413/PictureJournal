name: picture-journal-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: docker compose up -d postgres --wait
      - run: docker compose ps
      - run: chmod +x ./gradlew
      - run: ./gradlew generateOpenApiContract refreshOpenApiContract test --rerun-tasks
      - run: git diff --exit-code contracts/openapi/picture-journal.openapi.json
      - if: always()
        run: docker compose down -v
