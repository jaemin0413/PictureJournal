services:
  postgres:
    image: postgres:16
    container_name: picturejournal-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picturejournal}
      POSTGRES_USER: ${POSTGRES_USER:-picturejournal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picturejournal-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picturejournal} -d ${POSTGRES_DB:-picturejournal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
