spring:
  application:
    name: picturejournal
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/picturejournal}
    username: ${DB_USERNAME:picturejournal}
    password: ${DB_PASSWORD:picturejournal-dev-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.validation.mode: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    bucket: ${STORAGE_BUCKET:picturejournal-local}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
  media:
    root: data/media

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/picturejournal}
    username: ${DB_USERNAME:picturejournal}
    password: ${DB_PASSWORD:picturejournal-dev-password}
management:
  endpoint:
    health:
      show-details: always